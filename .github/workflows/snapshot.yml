name: Snapshot
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  snapshot:
    name: Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Build packages
        run: bun run --filter '@repo/*' build
      - name: Create snapshot
        id: snapshot
        run: bun --bun run pkg-pr-new publish --bun --packageManager=bun --comment=off ./packages/*
