name: Setup
description: Install the Bun workspace from its lockfile.

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Setup Node.js for Cloudflare tooling
      uses: actions/setup-node@v4
      with:
        node-version: 24.5.0
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
